include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    prefer_single_quotes: true

analyzer:
  # Kept in sync with Flutter's AnalysisOptionsMigration, which otherwise
  # rewrites this file during `flutter pub get` and leaves the tree dirty
  # for `pub publish --dry-run`. The list is exactly what it requires for a
  # package with android/ and ios/ directories.
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
